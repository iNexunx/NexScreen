name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nombre de versión (ej. 1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determinar versión
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexun.jks"
            {
              echo "KS_FILE=$RUNNER_TEMP/nexun.jks"
              echo "STORE_TYPE=JKS"
              echo "STORE_PASSWORD=$STORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo ">>> Firmando con tu keystore"
          else
            cp keystore/aosp-testkey.p12 "$RUNNER_TEMP/aosp-testkey.p12"
            {
              echo "KS_FILE=$RUNNER_TEMP/aosp-testkey.p12"
              echo "STORE_TYPE=PKCS12"
              echo "STORE_PASSWORD=android"
              echo "KEY_ALIAS=testkey"
              echo "KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "::warning title=Testkey de AOSP::No hay secretos de firma configurados. Se firma con el testkey publico de AOSP (CN=Android). Es la MISMA clave que tiene todo el mundo: sirve para pruebas, pero cualquiera puede firmar una actualizacion que Android aceptara como tuya."
          fi

      - name: Validar keystore
        run: |
          keytool -list -keystore "$KS_FILE" -storetype "$STORE_TYPE" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Build release (R8 + shrink)
        env:
          NEXUN_KEYSTORE: ${{ env.KS_FILE }}
          NEXUN_STORE_TYPE: ${{ env.STORE_TYPE }}
          NEXUN_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          NEXUN_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          NEXUN_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.versionCode=1

      - name: Verificar que el APK está firmado
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No se generó APK"
            exit 1
          fi
          # El runner tiene varias versiones de build-tools. Un glob directo
          # ("build-tools/*/apksigner") expande a N rutas y las que sobran se
          # pasan como argumentos, así que apksigner responde
          # "Unsupported command: ...". Nos quedamos con la más alta.
          APKSIGNER=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "NexScreen-${{ steps.ver.outputs.name }}.apk"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.name }}
          STORE_TYPE: ${{ env.STORE_TYPE }}
        run: |
          NOTES="$(mktemp)"
          if [ "$STORE_TYPE" = "PKCS12" ]; then
            {
              printf '%s\n' '> [!WARNING]'
              printf '%s\n' '> Esta build esta firmada con el **testkey publico de AOSP** (`CN=Android`).'
              printf '%s\n' '> Es una clave que tiene todo el mundo, asi que **no aporta seguridad**: cualquiera'
              printf '%s\n' '> con la misma clave podria firmar una actualizacion que Android aceptaria como tuya.'
              printf '%s\n' '> Sirve para pruebas, no para distribuir entre usuarios reales.'
              printf '\n%s\n' '> Para una release real hay que configurar los secretos `KEYSTORE_B64`, `STORE_PASSWORD`, `KEY_ALIAS` y `KEY_PASSWORD`.'
            } > "$NOTES"
          fi
          # Solo en dispatch creamos el tag. Si el workflow entra por
          # `push: tags: v*`, el tag ya existe y `git tag -a` fallaria.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git tag -a "v$TAG" -m "Release $TAG"
            git push origin "v$TAG"
          fi
          gh release create "v$TAG" \
            "NexScreen-$TAG.apk" \
            --title "NexScreen $TAG" \
            --notes-file "$NOTES" \
            --generate-notes
